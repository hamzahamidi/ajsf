name: Release

# Releases are driven by the version in projects/ajsf-core/package.json, set by
# `npm run version:set`. Merging a commit that CHANGES that version publishes
# it. Every other merge is a no-op.
#
# The trigger is the change, not a mismatch with npm. A repository version
# sitting ahead of what is published is normal, and treating that as "release
# me" starts a run on every unrelated merge and leaves it waiting at the
# approval gate. The npm check remains, demoted to a safety net that refuses to
# republish an existing version.
#
# This is deliberately ONE workflow rather than "merge creates a tag, tag
# triggers publish". A tag pushed with GITHUB_TOKEN does not start another
# workflow run, so that chain would silently never publish. Making it work
# needs a PAT or a GitHub App, which reintroduces the long-lived credential
# OIDC exists to remove. So the tag is an output here, not an input.
#
# CI owns testing. This workflow fires after CI succeeds on main via
# workflow_run, so library tests are not repeated here. The verify job's
# responsibility is reproducible package construction: build the dist
# tarballs, confirm every package carries the release version, and upload the
# exact artifact that the gated publish job will ship.
#
# Three jobs, in this order for a reason. An environment protection rule blocks
# a job before ANY of its steps run, so building inside the gated job would
# mean approving before knowing whether it compiles. `verify` is therefore
# ungated and runs first, and `release` publishes the artifact `verify` already
# built. Approving means "this built and passed, ship it" rather than "go ahead
# and try".

# There is deliberately no `workflow_dispatch` here. A dispatch can target any
# branch or tag, and this workflow runs in default-branch context with the
# capability to publish, so a manual trigger meant checking out an arbitrary
# ref and executing it on the way to npm. CodeQL flags that as cache poisoning
# via a poisonable step, and it also made "dispatch the release" a way to skip
# CI entirely. To re-run a release, re-run the failed run from the Actions UI:
# that replays the original workflow_run payload, so it stays pinned to the
# commit CI tested rather than to whatever main looks like now.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Least privilege by default. Only the gated `release` job raises this, because
# `verify` runs repository code (`npm ci`, `npm run build:libs`) before any
# approval, and a write token or an OIDC credential in that job would be
# reachable from a postinstall or ng-packagr hook. The environment gate is the
# approval boundary; it is only a security boundary if the ungated jobs cannot
# publish or push on their own.
permissions:
  contents: read

# npm assigns a dist-tag to whatever version is published and does not enforce
# that `latest` moves forward, so two releases publishing at once can leave
# `latest` on the older one. Serializing every run of this workflow keeps the
# six packages moving as one. GitHub does not promise queue order, so the
# release job re-checks the registry after approval as well.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    # A manually dispatched CI run also satisfies workflow_run, so the event is
    # pinned to `push`: a release follows a merge, not a re-run of CI.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
      dist-tag: ${{ steps.check.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2   # need the previous commit to diff the version
          persist-credentials: false

      - name: Did this push change the version
        id: check
        run: |
          MANIFEST=projects/ajsf-core/package.json
          VERSION=$(node -p "require('./$MANIFEST').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          case "$VERSION" in
            *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            PREVIOUS=$(git show HEAD^:"$MANIFEST" 2>/dev/null \
              | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).version}catch(e){''}" || true)
            if [ "$PREVIOUS" = "$VERSION" ]; then
              CHANGED=no
              echo "[release] version unchanged at $VERSION, nothing to do"
            else
              CHANGED=yes
              echo "[release] version changed from ${PREVIOUS:-none} to $VERSION"
            fi
          else
            CHANGED=no
            echo "[release] no previous commit to compare, nothing to do"
          fi

          # Safety net, not the trigger: never republish an existing version.
          #
          # Both npm behaviours have to read as absent, because this changed
          # under us: npm 12 exits non-zero with E404 for a missing version of
          # an existing package, where older npm exited 0 with empty stdout.
          # A blanket `|| true` covers both but fails open, so a registry
          # outage or a DNS failure reads as "not published yet" and sends a
          # bogus release to the approval gate. Only an E404 means absent; any
          # other failure stops the release.
          ERRFILE=$(mktemp)
          if OUT=$(npm view "@ajsf/core@$VERSION" version 2>"$ERRFILE"); then
            PUBLISHED=$(printf '%s' "$OUT" | tr -d '[:space:]')
          elif grep -q 'E404' "$ERRFILE"; then
            PUBLISHED=""
          else
            echo "[release] npm view failed, refusing to guess:"
            cat "$ERRFILE"
            exit 1
          fi

          if [ "$CHANGED" = "no" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$PUBLISHED" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "[release] refusing: @ajsf/core@$VERSION is already on npm"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "[release] releasing $VERSION"
          fi

  verify:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - run: npm ci

      - name: Test scripts
        run: npm run test:scripts

      - name: Build libraries
        run: npm run build:libs

      - name: Confirm every package carries the release version
        run: |
          VERSION="${{ needs.decide.outputs.version }}"
          COUNT=0
          for dir in dist/@ajsf/*/; do
            pkg=$(basename "$dir")
            BUILT=$(node -p "require('./$dir/package.json').version")
            if [ "$BUILT" != "$VERSION" ]; then
              echo "[release] dist/@ajsf/$pkg is $BUILT, expected $VERSION"
              exit 1
            fi
            COUNT=$((COUNT + 1))
          done
          if [ "$COUNT" -ne 6 ]; then
            echo "[release] expected 6 packages but found $COUNT"
            exit 1
          fi
          echo "[release] all $COUNT packages at $VERSION"

      # Publishing the artifact verify built, rather than rebuilding inside the
      # gated job, means the gated job compiles nothing. It is not yet a
      # byte-for-byte guarantee: `npm publish <dir>` packs the directory at
      # publish time and would run any prepack or prepare script the package
      # gained. Packing here and publishing the tarballs would close that.
      - name: Upload the verified packages
        uses: actions/upload-artifact@v7
        with:
          name: ajsf-dist-${{ needs.decide.outputs.version }}
          path: dist/@ajsf/
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [decide, verify]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Requires a manual approval before anything reaches npm. By the time this
    # job is offered for approval, verify has already built and tested the
    # exact artifact it will publish. Configure the environment once in
    # Settings > Environments > npm-publish with yourself as a required
    # reviewer. Free on public repositories.
    environment: npm-publish
    # The only job that gets these, and only behind the approval gate:
    # `contents: write` pushes the tag and creates the release, `id-token`
    # mints the OIDC credential npm trusted publishing exchanges. The npm
    # trusted publisher for each package must name the `npm-publish`
    # environment, or this restriction buys nothing.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # NOT .nvmrc. This job publishes prebuilt tarballs and never compiles
      # anything, so it does not need the Angular toolchain's Node 16. It does
      # need an npm new enough for OIDC trusted publishing, and current npm
      # requires Node 22 or newer, so pinning Node 16 here made
      # `npm i -g npm@latest` fail with EBADENGINE before any publish ran.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm that supports OIDC
        run: npm i -g npm@latest

      - name: Download the verified packages
        uses: actions/download-artifact@v8
        with:
          name: ajsf-dist-${{ needs.decide.outputs.version }}
          path: dist/@ajsf/

      # An approval can sit for hours, so `decide`'s reading of the registry is
      # stale by the time anyone clicks it. Re-reading here closes two gaps the
      # concurrency group alone cannot: another run may have published this
      # version already, and a stable release must never drag `latest`
      # backwards, which npm permits because a dist-tag points at whatever was
      # published last rather than at the highest version.
      - name: Re-check the registry after approval
        run: |
          VERSION="${{ needs.decide.outputs.version }}"
          DIST_TAG="${{ needs.decide.outputs.dist-tag }}"

          ERRFILE=$(mktemp)
          if OUT=$(npm view "@ajsf/core@$VERSION" version 2>"$ERRFILE"); then
            if [ -n "$(printf '%s' "$OUT" | tr -d '[:space:]')" ]; then
              echo "[release] @ajsf/core@$VERSION appeared on npm since approval, refusing"
              exit 1
            fi
          elif ! grep -q 'E404' "$ERRFILE"; then
            echo "[release] npm view failed, refusing to guess:"
            cat "$ERRFILE"
            exit 1
          fi

          if [ "$DIST_TAG" = "latest" ]; then
            CURRENT=$(npm view "@ajsf/core" version 2>/dev/null || true)
            if [ -n "$CURRENT" ] && [ "$CURRENT" != "$VERSION" ]; then
              HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" \
                | sort -V | tail -1)
              if [ "$HIGHEST" != "$VERSION" ]; then
                echo "[release] latest is $CURRENT, publishing $VERSION would move it backwards"
                exit 1
              fi
            fi
          fi
          echo "[release] registry still expects $VERSION on $DIST_TAG"

      - name: Publish core
        run: npm publish dist/@ajsf/core --provenance --access public --tag ${{ needs.decide.outputs.dist-tag }}

      # Derived from what verify actually built, rather than a hand written
      # list. The list read "bootstrap3 bootstrap4 material" when @ajsf/bootstrap5
      # was added, so the new package would have been skipped silently while the
      # job reported success.
      - name: Publish frameworks
        run: |
          for dir in dist/@ajsf/*/; do
            pkg=$(basename "$dir")
            if [ "$pkg" = "core" ]; then continue; fi   # already published above
            echo "[release] publishing @ajsf/$pkg"
            npm publish "$dir" --provenance --access public --tag ${{ needs.decide.outputs.dist-tag }}
          done

      - name: Tag the released commit
        run: |
          VERSION="${{ needs.decide.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"
          echo "[release] tagged v$VERSION on $(git rev-parse HEAD)"

      # Without this the releases page shows nothing for a real release. It
      # previously listed the demo application's version (15.0.0, 14.0.0),
      # which had no relationship to what was on npm, where the libraries were
      # 0.8.0 and 0.7.0. Library releases are tagged v<version> to keep them
      # distinguishable from those older, unrelated entries.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.decide.outputs.version }}"
          DIST_TAG="${{ needs.decide.outputs.dist-tag }}"
          # Listed from what was published rather than hand written, for the
          # same reason the publish loop is.
          PACKAGES=$(for d in dist/@ajsf/*/; do printf '`@ajsf/%s` ' "$(basename "$d")"; done)
          NOTES=$(printf '%s\n' \
            "$PACKAGES published at \`$VERSION\` on the \`$DIST_TAG\` dist-tag." \
            "" \
            "\`\`\`sh" \
            "npm install @ajsf/core@$VERSION" \
            "\`\`\`" \
            "")
          # --generate-notes starts from the previous tag, which for a stable
          # release is its own last release candidate: the page would list the
          # version bump and nothing from the series it completes. A stable
          # release therefore generates from the last stable tag and carries
          # the major's upgrade note when one is written.
          PRERELEASE=""
          NOTES_START=""
          case "$VERSION" in
            *-*)
              PRERELEASE="--prerelease"
              ;;
            *)
              LAST_STABLE=$(gh release list --exclude-pre-releases --exclude-drafts \
                --limit 1 --json tagName --jq '.[0].tagName')
              if [ -n "$LAST_STABLE" ] && [ "$LAST_STABLE" != "null" ]; then
                NOTES_START="--notes-start-tag $LAST_STABLE"
                echo "[release] generating notes from $LAST_STABLE"
              fi
              # Only a major's first stable release. The file is named by the
              # major alone, so a plain existence check would repeat the whole
              # document on every later release of that major.
              case "$VERSION" in
                *.0.0)
                  UPGRADE_NOTE="docs/release-notes/${VERSION%%.*}.md"
                  if [ -f "$UPGRADE_NOTE" ]; then
                    NOTES=$(printf '%s\n%s\n' "$NOTES" "$(cat "$UPGRADE_NOTE")")
                    echo "[release] included $UPGRADE_NOTE"
                  fi
                  ;;
              esac
              ;;
          esac

          gh release create "v$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES" \
            --generate-notes \
            $NOTES_START \
            $PRERELEASE
