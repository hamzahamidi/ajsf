name: CI

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x]

    steps:
    - uses: actions/checkout@v7
    - name: Setup Node ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - name: Test scripts
      run: npm run test:scripts
    - name: Build libs and demo
      run: npm run build:demo
    - name: Test libs
      run: |
        npm run test:core -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
        npm run test:bs3 -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
        npm run test:bs4 -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
        npm run test:material -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
    # The codecov npm package is deprecated and its uploader now fails against
    # the current API with "result.split is not a function". This action is the
    # supported path. It is non-blocking on purpose: a coverage upload outage
    # should not fail a build whose tests all passed.
    - name: Publish code coverage
      uses: codecov/codecov-action@v7
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./coverage
        fail_ci_if_error: false
