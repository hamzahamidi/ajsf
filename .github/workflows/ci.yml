name: CI

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 20 reached end of life on 2026-04-30, so it is gone whatever the
        # engine range still permits. 22 is in maintenance until 2027-04-30 and
        # 24 is the active LTS until 2028-04-30.
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Node ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - name: Test scripts
      run: npm run test:scripts
    - name: Build libs and demo
      run: npm run build:demo
    - name: Test libs
      # One implementation for CI and `npm run coverage`, because the Vitest
      # path needs orchestration that cannot be expressed as configuration:
      # dist/test-out must be cleaned before each suite or stale run
      # directories distort V8 coverage, and every Vitest suite wipes
      # coverage/ before writing lcov.info, so reports are staged and restored.
      # It also picks each suite's flags from its runner, which differ.
      run: node scripts/run-coverage.js
    - name: Enforce project coverage floor
      if: matrix.node-version == '24.x'
      run: npm run coverage:report
    - name: Analyze with SonarQube Cloud
      if: matrix.node-version == '24.x' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
