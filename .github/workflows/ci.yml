name: CI

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v7
    - name: Setup Node ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - name: Test scripts
      run: npm run test:scripts
    - name: Build libs and demo
      run: npm run build:demo
    - name: Test libs
      run: |
        npm run test:core -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
        npm run test:bs3 -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
        npm run test:bs4 -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
        npm run test:bs5 -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
        npm run test:material -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
        npm run test:primeng -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
    # The codecov npm package is deprecated and its uploader now fails against
    # the current API with "result.split is not a function". This action is the
    # supported path.
    #
    # Only one leg uploads. Both produce identical coverage for the same commit,
    # so uploading twice just makes Codecov merge duplicates.
    #
    # Failures are surfaced rather than swallowed. This step previously ran with
    # continue-on-error and fail_ci_if_error: false, and reported success while
    # every upload was rejected with "Token required because branch is
    # protected". Nine pull requests merged before anyone noticed there was no
    # coverage data. An upload that cannot fail cannot tell you it is broken.
    - name: Publish code coverage
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./coverage
        fail_ci_if_error: true
