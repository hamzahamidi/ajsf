sonar.organization=hamzahamidi-1
sonar.projectKey=hamzahamidi_ajsf
sonar.sources=projects
sonar.tests=projects
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/testing/**
# Corpus wrappers register their cases through the shared harness.
sonar.issue.ignore.multicriteria=corpusHarness
sonar.issue.ignore.multicriteria.corpusHarness.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.corpusHarness.resourceKey=projects/ajsf-*/src/lib/corpus.spec.ts
# Locale catalogs and framework adapters intentionally repeat the same contracts.
sonar.cpd.exclusions=projects/ajsf-bootstrap*/src/lib/*-framework.component.ts,projects/ajsf-core/src/lib/locale/*-validation-messages.ts,projects/ajsf-core/src/lib/widget-library/*.component.ts,projects/ajsf-material/src/lib/widgets/*.component.ts,projects/ajsf-primeng/src/lib/widgets/*.component.ts
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info
sonar.qualitygate.wait=true
